<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodalies de Catalunya - Retards d'Avui</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">🚆 Estat de Rodalies Avui</h1>
            <p class="text-slate-500 mt-2">Anàlisi en temps real</p>
        </header>

        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-slate-600 mt-2">Carregant dades del servei...</p>
        </div>

        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6">
            <strong class="font-bold">Error de connexió! </strong>
            <span id="error-message"></span>
        </div>

        <div id="content" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stats-container"></div>

            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-xl font-bold text-slate-900 mb-4">Estat per Línies</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="lines-container"></div>
            </div>

            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-xl font-bold text-slate-900 mb-4">Incidències Actives</h2>
                <div id="incidents-container" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'etf_5c7348c414836e8020a90ae0b78c007bf1011986749088f659c06bc58f8b1a09';
        const BASE_URL = 'https://www.eltrennofunca.cat/api';

        async function fetchData() {
            const headers = { 'X-API-Key': API_KEY };

            try {
                console.ant?.('Fent peticions a l\'API...');
                
                const [statsRes, linesRes, incidentsRes] = await Promise.all([
                    fetch(`${BASE_URL}/stats`, { headers }),
                    fetch(`${BASE_URL}/lines`, { headers }),
                    fetch(`${BASE_URL}/incidents`, { headers })
                ]);

                if (!statsRes.ok || !linesRes.ok || !incidentsRes.ok) {
                    throw new Error(`Error HTTP: ${statsRes.status} o permís denegat.`);
                }

                const statsData = await statsRes.json();
                const linesData = await linesRes.json();
                const incidentsData = await incidentsRes.json();

                console.log("Stats rebudes:", statsData);
                console.log("Lines rebudes:", linesData);
                console.log("Incidents rebuts:", incidentsData);

                renderStats(statsData);
                renderLines(linesData.data || linesData);
                renderIncidents(incidentsData.data || incidentsData);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (err) {
                console.error("Detall de l'error:", err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').textContent = err.message + " (Pot ser degut a restriccions CORS del navegador o a la clau API).";
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderStats(stats) {
            const container = document.getElementById('stats-container');
            container.innerHTML = `
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Retards totals avui</p>
                    <p class="text-2xl font-bold text-slate-900 mt-1">${stats.total_delays ?? stats.retards ?? '0'}</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Incidències actives</p>
                    <p class="text-2xl font-bold text-amber-600 mt-1">${stats.active_incidents ?? stats.incidents ?? '0'}</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Estat general</p>
                    <p class="text-2xl font-bold text-emerald-600 mt-1">${stats.status ?? 'Operatiu'}</p>
                </div>
            `;
        }

        function renderLines(lines) {
            const container = document.getElementById('lines-container');
            container.innerHTML = '';
            const linesArray = Array.isArray(lines) ? lines : (lines.data || []);

            if (linesArray.length === 0) {
                container.innerHTML = '<p class="text-slate-500 col-span-full">No hi ha dades de línies.</p>';
                return;
            }

            linesArray.forEach(line => {
                container.innerHTML += `
                    <div class="border border-slate-200 rounded-lg p-3 flex flex-col justify-between bg-slate-50">
                        <span class="font-bold text-lg text-indigo-600">${line.name || line.id || 'Línia'}</span>
                        <span class="text-xs text-slate-500 mt-1">${line.status || 'Normal'}</span>
                    </div>
                `;
            });
        }

        function renderIncidents(incidents) {
            const container = document.getElementById('incidents-container');
            container.innerHTML = '';
            const incidentsArray = Array.isArray(incidents) ? incidents : (incidents.data || []);

            if (incidentsArray.length === 0) {
                container.innerHTML = '<p class="text-slate-500">Cap incidència greu reportada en aquest moment. 🎉</p>';
                return;
            }

            incidentsArray.forEach(inc => {
                container.innerHTML += `
                    <div class="border-l-4 border-amber-500 bg-amber-50 p-4 rounded-r-lg">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-amber-900">${inc.title || inc.line || 'Incidència'}</h3>
                            <span class="text-xs bg-amber-200 text-amber-800 px-2 py-0.5 rounded font-medium">${inc.severity || 'Mitjana'}</span>
                        </div>
                        <p class="text-sm text-amber-700 mt-1">${inc.description || inc.message || 'Sense descripció.'}</p>
                    </div>
                `;
            });
        }

        fetchData();
    </script>
</body>
</html>
    <!-- Script JavaScript per connectar a l'API -->
    <script>
        const API_KEY = 'etf_5c7348c414836e8020a90ae0b78c007bf1011986749088f659c06bc58f8b1a09';
        const BASE_URL = 'https://www.eltrennofunca.cat/api';

        async function fetchData() {
            const headers = { 'X-API-Key': API_KEY };

            try {
                // Fem les peticions en paral·lel per a més velocitat
                const [statsRes, linesRes, incidentsRes] = await Promise.all([
                    fetch(`${BASE_URL}/stats`, { headers }),
                    fetch(`${BASE_URL}/lines`, { headers }),
                    fetch(`${BASE_URL}/incidents`, { headers })
                ]);

                if (!statsRes.ok || !linesRes.ok || !incidentsRes.ok) {
                    throw new Error('La resposta de l\'API no ha estat exitosa (comprova l\'API Key).');
                }

                const statsData = await statsRes.json();
                const linesData = await linesRes.json();
                const incidentsData = await incidentsRes.json();

                renderStats(statsData);
                renderLines(linesData.data || linesData);
                renderIncidents(incidentsData.data || incidentsData);

                // Amagar loading i mostrar contingut
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').textContent = err.message;
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderStats(stats) {
            const container = document.getElementById('stats-container');
            container.innerHTML = `
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Retards totals avui</p>
                    <p class="text-2xl font-bold text-slate-900 mt-1">${stats.total_delays || stats.retards || 'N/D'}</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Incidències actives</p>
                    <p class="text-2xl font-bold text-amber-600 mt-1">${stats.active_incidents || stats.incidents || 'N/D'}</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Estat general</p>
                    <p class="text-2xl font-bold text-emerald-600 mt-1">${stats.status || 'Operatiu'}</p>
                </div>
            `;
        }

        function renderLines(lines) {
            const container = document.getElementById('lines-container');
            container.innerHTML = '';
            
            // Si lines és un array, el recorrem
            const linesArray = Array.isArray(lines) ? lines : [];

            if (linesArray.length === 0) {
                container.innerHTML = '<p class="text-slate-500 col-span-full">No hi ha dades de línies disponibles.</p>';
                return;
            }

            linesArray.forEach(line => {
                container.innerHTML += `
                    <div class="border border-slate-200 rounded-lg p-3 flex flex-col justify-between bg-slate-50">
                        <span class="font-bold text-lg text-indigo-600">${line.name || line.id}</span>
                        <span class="text-xs text-slate-500 mt-1">${line.status || 'Normal'}</span>
                    </div>
                `;
            });
        }

        function renderIncidents(incidents) {
            const container = document.getElementById('incidents-container');
            container.innerHTML = '';

            const incidentsArray = Array.isArray(incidents) ? incidents : (incidents.data || []);

            if (incidentsArray.length === 0) {
                container.innerHTML = '<p class="text-slate-500">Cap incidència greu reportada en aquest moment. 🎉</p>';
                return;
            }

            incidentsArray.forEach(inc => {
                container.innerHTML += `
                    <div class="border-l-4 border-amber-500 bg-amber-50 p-4 rounded-r-lg">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-amber-900">${inc.title || inc.line || 'Incidència'}</h3>
                            <span class="text-xs bg-amber-200 text-amber-800 px-2 py-0.5 rounded font-medium">${inc.severity || 'Mitjana'}</span>
                        </div>
                        <p class="text-sm text-amber-700 mt-1">${inc.description || inc.message || 'Sense descripció detallada.'}</p>
                    </div>
                `;
            });
        }

        // Executar la funció en carregar la pàgina
        fetchData();
    </script>
</body>
</html>
