<script>
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/stats');
                const jsonText = await response.text(); // Llegim primer com a text per veure-ho tot
                
                console.log("Resposta crua:", jsonText);

                // Mostrem el JSON cru a la pantalla temporalment per diagnosticar
                document.getElementById('most-affected-content').innerHTML = `
                    <p class="font-bold text-red-600 mb-2">DEBUG - JSON rebut del servidor:</p>
                    <pre class="text-xs overflow-auto bg-slate-900 text-green-400 p-2 rounded">${jsonText}</pre>
                `;
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');

                const data = JSON.parse(jsonText);
                // ... (aquí aniria el render si tot quadra)

            } catch (err) {
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').textContent = err.message;
                document.getElementById('error').classList.remove('hidden');
            }
        }

        fetchDashboardData();
    </script>
