<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodalies de Catalunya - Panell i Detall d'Incidències</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        <!-- Capçalera -->
        <header class="text-center bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">🚆 Estat i Històric de Rodalies</h1>
            <p class="text-slate-500 mt-2">Monitorització global i detall d'incidències en temps real</p>
            <p id="last-update" class="text-xs text-slate-400 mt-2"></p>
        </header>

        <!-- Indicador de Càrrega -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-slate-600 mt-3 font-medium">Carregant dades del sistema...</p>
        </div>

        <!-- Missatge d'Error -->
        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
            <strong class="font-bold">Error! </strong>
            <span id="error-message"></span>
        </div>

        <!-- Contingut Principal -->
        <div id="content" class="hidden space-y-6">
            
            <!-- Resum d'Incidències (Targetes Globals) -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="stats-grid">
                <!-- S'omplirà dinàmicament -->
            </div>

            <!-- Detall de la Línia més afectada -->
            <div class="bg-white shadow-sm rounded-xl p-6 border border-slate-100" id="most-affected-container">
                <!-- S'omplirà dinàmicament -->
            </div>

            <!-- Llistat Detallat de Cada Incidència -->
            <div class="bg-white shadow-sm rounded-xl p-6 border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-900">Llistat Detallat d'Incidències</h2>
                    <span id="incidents-count" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium"></span>
                </div>

                <div id="incidents-list" class="space-y-4">
                    <!-- S'omplirà dinàmicament -->
                </div>
            </div>

        </div>
    </div>

    <script>
        async function fetchAllData() {
            try {
                const [statsRes, incidentsRes] = await Promise.all([
                    fetch('/api/stats'),
                    fetch('/api/incidents')
                ]);

                if (!statsRes.ok || !incidentsRes.ok) {
                    throw new Error('Error al carregar les dades des del servidor.');
                }

                const statsJson = await statsRes.json();
                const incidentsJson = await incidentsRes.json();

                console.log("ESTAT INCIDÈNCIES REBUT:", incidentsJson); // <-- Mira això a la consola (F12)

                const statsData = statsJson.data || statsJson;
                
                // Extreure l'array d'incidències de manera flexible segons provingui
                let incidentsArray = [];
                const rawIncidents = incidentsJson.data || incidentsJson.items || incidentsJson;
                
                if (Array.isArray(rawIncidents)) {
                    incidentsArray = rawIncidents;
                } else if (typeof rawIncidents === 'object' && rawIncidents !== null) {
                    incidentsArray = Object.values(rawIncidents).filter(item => typeof item === 'object' && item !== null);
                }

                renderStats(statsData);
                renderIncidentsList(incidentsArray);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').textContent = err.message;
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderStats(data) {
            if (data.lastUpdate) {
                const date = new Date(data.lastUpdate);
                document.getElementById('last-update').textContent = `Última actualització: ${date.toLocaleString('ca-ES')}`;
            }

            // Targetes globals
            const grid = document.getElementById('stats-grid');
            grid.innerHTML = `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Incidències Avui</p>
                    <p class="text-3xl font-extrabold text-slate-900 mt-1">${data.totalIncidentsToday ?? 0}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Incidències (Setmana)</p>
                    <p class="text-3xl font-extrabold text-amber-600 mt-1">${data.totalIncidentsWeek ?? 0}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Incidències (Mes)</p>
                    <p class="text-3xl font-extrabold text-red-600 mt-1">${data.totalIncidentsMonth ?? 0}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-medium text-slate-500">Línies Afectades</p>
                    <p class="text-3xl font-extrabold text-indigo-600 mt-1">${data.linesAffected ?? 0}</p>
                </div>
            `;

            // Línia més afectada
            const affectedContainer = document.getElementById('most-affected-container');
            if (data.mostAffectedLine) {
                const m = data.mostAffectedLine;
                affectedContainer.innerHTML = `
                    <h2 class="text-xl font-bold text-slate-900 mb-4">Línia amb més incidències</h2>
                    <div class="p-4 bg-indigo-50 border-l-4 border-indigo-600 rounded-r-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <span class="text-2xl font-black text-indigo-700">${m.line}</span>
                            <h3 class="font-bold text-slate-900 text-lg mt-0.5">${m.name}</h3>
                        </div>
                        <div class="flex gap-4 text-sm font-semibold">
                            <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">Incidències: ${m.incidents}</span>
                        </div>
                    </div>
                `;
            } else {
                affectedContainer.innerHTML = '';
            }
        }

        function renderIncidentsList(incidents) {
            const container = document.getElementById('incidents-list');
            document.getElementById('incidents-count').textContent = `${incidents.length} actives`;

            if (incidents.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-8">Cap incidència greu reportada en aquest moment. 🎉</p>';
                return;
            }

            container.innerHTML = incidents.map(inc => {
                const lineName = inc.line || inc.liniename || inc.linia || 'General';
                const titleText = inc.title || inc.message || inc.titol || 'Incidència a la via';
                const descText = inc.description || inc.descripcio || inc.detall || 'Sense descripció addicional.';
                const severity = inc.severity || inc.gravetat || 'Mitjana';
                const badgeColor = ['critica', 'alta', 'critical'].includes(severity.toLowerCase()) ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800';

                return `
                    <div class="border border-slate-100 bg-slate-50/50 p-4 rounded-xl flex flex-col justify-between gap-2 hover:bg-slate-50 transition">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded text-sm">${lineName}</span>
                                <span class="text-xs font-semibold px-2 py-0.5 rounded ${badgeColor}">${severity}</span>
                            </div>
                        </div>
                        <h3 class="font-bold text-slate-900 mt-1">${titleText}</h3>
                        <p class="text-sm text-slate-600">${descText}</p>
                    </div>
                `;
            }).join('');
        }

        fetchAllData();
    </script>
</body>
</html>
